x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  db:
    image: postgres:15-alpine
    container_name: globalupc_db
    command: postgres -c max_connections=200 -c shared_buffers=128MB
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 512M
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-globalupc}
      POSTGRES_USER: ${POSTGRES_USER:-globalupc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-globalupc}
    ports:
      - "${DB_BIND:-127.0.0.1}:${DB_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - globalupc_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-globalupc}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: globalupc_backend
    init: true
    logging: *default-logging
    # Lets gunicorn finish in-flight requests and order fixes (graceful_timeout
    # 110s) before Docker sends SIGKILL.
    stop_grace_period: 120s
    deploy:
      resources:
        limits:
          memory: 1G
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-globalupc}:${POSTGRES_PASSWORD:-globalupc}@db:5432/${POSTGRES_DB:-globalupc}
      PYTHONUNBUFFERED: 1
      SERVER_IP: ${SERVER_IP:-localhost}
      FRONTEND_PORT: ${FRONTEND_PORT:-80}
      ALLOWED_IFRAME_ORIGINS: ${ALLOWED_IFRAME_ORIGINS:-}
    ports:
      - "${BACKEND_BIND:-127.0.0.1}:${BACKEND_PORT:-8001}:8000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - globalupc_network
    labels:
      - autoheal=true
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS --max-time 8 http://localhost:8000/api/health/deep > /dev/null || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 4
      start_period: 30s
    restart: unless-stopped
    # gunicorn supervises the 4 uvicorn workers: a worker that crashes or
    # whose event loop stops responding is replaced on its own, without
    # restarting the container. Settings in backend/gunicorn.conf.py.
    command: gunicorn main:app -c gunicorn.conf.py

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: globalupc_frontend
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 128M
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - globalupc_network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost/index.html || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  autoheal:
    image: willfarrell/autoheal:1.2.0
    container_name: globalupc_autoheal
    logging: *default-logging
    environment:
      AUTOHEAL_CONTAINER_LABEL: autoheal
      AUTOHEAL_INTERVAL: 30
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - globalupc_network
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  globalupc_network:
    driver: bridge
