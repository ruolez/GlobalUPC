worker_processes auto;

events {
    worker_connections 4096;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # The lost-products analysis POSTs one order id per lost customer (~17
    # bytes each). The 1m default would start returning an opaque 413 at
    # roughly 60,000 orders, which is reachable on a multi-year range.
    client_max_body_size 16m;

    # Disable caching for immediate updates
    sendfile off;
    tcp_nopush off;
    tcp_nodelay on;

    # Logging
    log_format main_rt '$remote_addr [$time_local] "$request" $status $body_bytes_sent '
                       'rt=$request_time urt=$upstream_response_time rid=$request_id';
    access_log /var/log/nginx/access.log main_rt;
    error_log /var/log/nginx/error.log;

    # app.js alone is ~1.3MB and is re-sent on every load (no-store), and the
    # report endpoints return multi-MB JSON. SSE (text/event-stream) is left
    # out on purpose: compressing it would buffer the progress events.
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Re-resolve the backend through Docker's DNS: an update recreates the
    # backend container, which can come back on a new IP. Without this nginx
    # keeps the address it resolved at startup and answers 502 forever.
    resolver 127.0.0.11 valid=10s ipv6=off;

    upstream globalupc_backend {
        zone globalupc_backend 64k;
        # max_fails=0: with a single server, never mark it down after a failed
        # request (nginx would otherwise refuse to try it for fail_timeout).
        server backend:8000 resolve max_fails=0;
        keepalive 32;
        # Must stay below the backend's keep-alive (75s) so nginx never reuses
        # a connection the backend is closing.
        keepalive_timeout 60s;
    }

    # Per-client guard rails. Both run in dry-run mode (log only, never reject)
    # until real traffic has been measured: grep the error log for
    # "limiting requests, dry run" / "limiting connections, dry run", then
    # drop the *_dry_run lines to enforce.
    limit_req_zone $binary_remote_addr zone=api_rate:10m rate=50r/s;
    limit_conn_zone $binary_remote_addr zone=api_conn:10m;
    limit_req_status 429;
    limit_conn_status 429;

    server {
        listen 80;
        server_name localhost;

        # Disable all caching
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        add_header Pragma "no-cache";
        add_header Expires "0";

        # Allow iframe embedding from specific origins
        add_header Content-Security-Policy "frame-ancestors 'self' http://192.168.1.110 http://localhost" always;
        add_header X-Frame-Options "ALLOWALL" always;

        if_modified_since off;
        etag off;

        # Serve frontend
        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;
        }

        # Proxy API requests to backend
        location /api/ {
            proxy_pass http://globalupc_backend/api/;
            proxy_http_version 1.1;
            # Empty Connection header keeps the upstream connection reusable
            # (the app uses no WebSockets).
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;

            # Disable caching for API
            proxy_no_cache 1;
            proxy_cache_bypass 1;

            # Cross-store MSSQL fan-outs (Month End, Business Overview) can
            # legitimately exceed nginx's 60s default on a cold first load.
            proxy_connect_timeout 10s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;

            # Buffering must stay off so a stalled SSE client's backpressure
            # reaches the backend (its send-timeout frees the stream) instead
            # of piling up in nginx temp files with the upstream kept alive.
            proxy_buffering off;

            limit_req zone=api_rate burst=200 nodelay;
            limit_req_dry_run on;
            limit_conn api_conn 60;
            limit_conn_dry_run on;

            # Errors nginx itself produces (backend restarting / unreachable /
            # too slow) answer JSON like the API does, instead of an HTML page
            # that browsers and API clients cannot parse. Responses the backend
            # sends (its own 4xx/5xx) pass through untouched: there is no
            # proxy_intercept_errors.
            error_page 502 @api_502;
            error_page 503 @api_503;
            error_page 504 @api_504;
            error_page 429 @api_429;
        }

        location @api_502 {
            default_type application/json;
            add_header Retry-After 5 always;
            add_header Cache-Control "no-store" always;
            return 502 '{"detail":"Service is restarting, retry shortly","retry_after":5}';
        }
        location @api_503 {
            default_type application/json;
            add_header Retry-After 5 always;
            add_header Cache-Control "no-store" always;
            return 503 '{"detail":"Service temporarily unavailable, retry shortly","retry_after":5}';
        }
        location @api_504 {
            default_type application/json;
            add_header Cache-Control "no-store" always;
            return 504 '{"detail":"The request took too long to complete"}';
        }
        location @api_429 {
            default_type application/json;
            add_header Retry-After 2 always;
            add_header Cache-Control "no-store" always;
            return 429 '{"detail":"Too many requests, slow down","retry_after":2}';
        }
    }
}
