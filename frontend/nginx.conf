events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # The lost-products analysis POSTs one order id per lost customer (~17
    # bytes each). The 1m default would start returning an opaque 413 at
    # roughly 60,000 orders, which is reachable on a multi-year range.
    client_max_body_size 16m;

    # Disable caching for immediate updates
    sendfile off;
    tcp_nopush off;
    tcp_nodelay on;

    # Logging
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    server {
        listen 80;
        server_name localhost;

        # Disable all caching
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        add_header Pragma "no-cache";
        add_header Expires "0";

        # Allow iframe embedding from specific origins
        add_header Content-Security-Policy "frame-ancestors 'self' http://192.168.1.110 http://localhost" always;
        add_header X-Frame-Options "ALLOWALL" always;

        if_modified_since off;
        etag off;

        # Serve frontend
        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;
        }

        # Proxy API requests to backend
        location /api/ {
            proxy_pass http://backend:8000/api/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Disable caching for API
            proxy_no_cache 1;
            proxy_cache_bypass 1;

            # Cross-store MSSQL fan-outs (Month End, Business Overview) can
            # legitimately exceed nginx's 60s default on a cold first load.
            proxy_connect_timeout 30s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;

            # Buffering must stay off so a stalled SSE client's backpressure
            # reaches the backend (its send-timeout frees the stream) instead
            # of piling up in nginx temp files with the upstream kept alive.
            proxy_buffering off;
        }
    }
}
